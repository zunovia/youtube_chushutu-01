[project]
name = "youtube-chushutu-backend"
version = "1.0.0"
description = "Local backend for YouTube Chushutu Chrome extension"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "yt-dlp>=2025.1.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
